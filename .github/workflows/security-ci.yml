name: Security & Core Verification CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify:
    name: Security Audit & Comprehensive Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install system dependencies for native crypto builds
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsecret-1-dev

      - name: Install NPM dependencies
        run: npm ci

      - name: Static Syntax & Packaging Integrity Check
        run: npm run lint

      - name: Run Master Adversarial & Cryptographic Test Suites
        run: npm test
