<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; font-family: monospace; background: #1f1c18; color: #f5f0e8; }
  .header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
  h1 { font-size: 13px; letter-spacing: 1px; margin: 0; color: #c8a96e; }
  .domain-tag { font-size: 10px; color: #9c9286; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { display: flex; align-items: center; gap: 8px; padding: 9px 10px; background: #2a2520; border: 1px solid #3a332c; border-radius: 4px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #777; flex-shrink: 0; }
  .dot.ok { background: #4caf70; }
  .dot.warn { background: #d4943a; }
  .dot.err { background: #d9534f; }
  button { width: 100%; margin-top: 10px; padding: 9px; font-family: monospace; font-size: 12px; font-weight: bold; border: 1px solid #c8a96e; background: #c8a96e; color: #1f1c18; border-radius: 4px; cursor: pointer; transition: opacity 0.15s; }
  button:hover:not(:disabled) { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; border-color: #554c43; background: #3a332c; color: #9c9286; }
  .hint { font-size: 10px; color: #8c8275; margin-top: 8px; line-height: 1.5; }
</style>
</head>
<body>
  <div class="header">
    <h1>⬡ FUIN</h1>
    <span class="domain-tag" id="domainTag">—</span>
  </div>
  <div class="status"><div class="dot" id="dot"></div><span id="statusText">Kontrol ediliyor...</span></div>
  <button id="fillBtn" disabled>Bu sayfayı doldur</button>
  <div class="hint">Fuin masaüstü uygulaması açık ve kilidi açılmış olmalıdır.</div>
  <script src="popup.js"></script>
</body>
</html>
